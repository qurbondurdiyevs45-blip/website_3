.reveal.show{opacity:1;transform:translateY(0);}
#projects{position:relative;overflow:hidden;}
.rocket{position:fixed;font-size:26px;left:10%;top:50%;z-index:50;pointer-events:none;
transform:translate(-50%,-50%) rotate(-45deg);will-change:left,top;}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px;position:relative;z-index:1;}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px;backdrop-filter:blur(10px);
transition:transform .35s cubic-bezier(.22,1,.36,1),box-shadow .35s ease,border-color .35s ease;}
.card:hover{transform:translateY(-6px) scale(1.02);border-color:var(--v);
box-shadow:0 0 0 1px color-mix(in oklab,var(--v) 35%,transparent),0 18px 60px -20px color-mix(in oklab,var(--v) 55%,transparent);}

.card h3{margin:10px 0 6px;font-size:17px;}

.tl{position:relative;padding-left:28px;border-left:2px solid var(--border);max-width:700px;margin:0 auto;}
.tl-item{margin-bottom:30px;position:relative;}
.tl-item::before{content:'';position:absolute;left:-36px;top:2px;width:13px;height:13px;border-radius:50%;background:var(--grad);}
.tl-item b{color:var(--c);font-size:13px;}
.tl-item h3{margin:4px 0;font-size:16px;}
.tl-item p{color:var(--muted);font-size:14px;}

.skillgrid{display:grid;gap:14px;max-width:700px;margin:0 auto;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));}
.about-grid{display:grid;gap:20px;grid-template-columns:3fr 2fr;}

.postgrid{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));}

const canvas=document.getElementById('bg'),ctx=canvas.getContext('2d');
function resize(){canvas.width=innerWidth;canvas.height=innerHeight;} resize();addEventListener('resize',resize);
const stars=Array.from({length:120},()=>({x:Math.random()*2000,y:Math.random()*2000,r:Math.random()*1.4+.3,tw:Math.random()*Math.PI*2}));
const planets=[
 {x:.12,y:.18,r:30,c1:'#ffd27a',c2:'#ff6a3d',speed:.02,name:'Quyosh'},
 {x:.88,y:.12,r:18,c1:'#e4e9ff',c2:'#8f9bc9',speed:.015,name:'Oy'},
 {x:.76,y:.68,r:17,c1:'#a78bff',c2:'#4b2fb8',speed:.03,name:'Neptun',ring:true},
 {x:.18,y:.78,r:12,c1:'#e26b4a',c2:'#7a2a13',speed:.04,name:'Mars'},
 {x:.5,y:.15,r:14,c1:'#7fd8ff',c2:'#1c5c8a',speed:.025,name:'Uran',ring:true},
 {x:.35,y:.55,r:10,c1:'#ffe08a',c2:'#a8760c',speed:.035,name:'Yupiter'}];
let ufos=Array.from({length:3},(_,i)=>({y:Math.random()*.8+.1,x:-.2-i*.4,speed:.006+Math.random()*.005}));
let t=0,scrollY=0;
addEventListener('scroll',()=>{scrollY=window.scrollY;},{passive:true});
function draw(){
 t+=0.006;
 ctx.clearRect(0,0,canvas.width,canvas.height);
 ctx.save();
 const py=(scrollY*0.05)%2000;
 stars.forEach(s=>{
   const sy=(s.y-py+2000)%2000;
   const alpha=.5+.5*Math.sin(t*2+s.tw);
   ctx.beginPath();ctx.arc((s.x/2000)*canvas.width,(sy/2000)*canvas.height,s.r,0,7);
   ctx.fillStyle=`rgba(255,255,255,${alpha*.8})`;ctx.fill();
 });
 planets.forEach((p,i)=>{
   const px=((p.x*canvas.width)+Math.sin(t*p.speed*20+i)*40);
   const pyy=((p.y*canvas.height)+Math.cos(t*p.speed*14+i)*30)-(scrollY*0.08*(i+1)*0.3);
   if(p.ring){
     ctx.save();ctx.translate(px,pyy);ctx.rotate(-.3+t*0.15);
     ctx.beginPath();ctx.ellipse(0,0,p.r*1.9,p.r*0.55,0,0,7);
     ctx.strokeStyle='rgba(200,190,255,.55)';ctx.lineWidth=3;ctx.stroke();ctx.restore();
   }
   const grad=ctx.createRadialGradient(px-p.r*0.3,pyy-p.r*0.3,p.r*0.2,px,pyy,p.r);
   grad.addColorStop(0,p.c1);grad.addColorStop(1,p.c2);
   ctx.beginPath();ctx.arc(px,pyy,p.r,0,7);ctx.fillStyle=grad;ctx.shadowColor=p.c1;ctx.shadowBlur=24;ctx.fill();ctx.shadowBlur=0;
   ctx.font='11px "JetBrains Mono", monospace';ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,.85)';
   ctx.fillText(p.name,px,pyy+p.r+16);
 });
 // ozga sayyoraliklar (UFO) — tez uchib o'tadi
 ufos.forEach(u=>{
   u.x+=u.speed;
   if(u.x>1.2) u.x=-.2;
   const ux=u.x*canvas.width, uy=u.y*canvas.height+Math.sin(t*3+u.x*10)*8;
   ctx.save();ctx.translate(ux,uy);
   ctx.beginPath();ctx.ellipse(0,0,16,6,0,0,7);ctx.fillStyle='rgba(180,255,220,.85)';ctx.shadowColor='#00e5c7';ctx.shadowBlur=14;ctx.fill();
   ctx.beginPath();ctx.arc(0,-4,7,Math.PI,0);ctx.fillStyle='rgba(120,255,240,.5)';ctx.fill();
   ctx.shadowBlur=0;ctx.restore();
 });
 ctx.restore();
 requestAnimationFrame(draw);
}
draw();
document.querySelectorAll('.rocket').forEach((r,i)=>{ r._tx=0;r._ty=0; });
(function(){
  const rockets=[...document.querySelectorAll('.rocket')];
  let target={x:innerWidth*0.1,y:innerHeight*0.5};
  document.addEventListener('mousemove',e=>{ target.x=e.clientX; target.y=e.clientY; });
  function loop(){
    rockets.forEach((r,i)=>{
      const speed=0.14;
      r._tx=r._tx??target.x; r._ty=r._ty??target.y;
      r._tx += (target.x - r._tx)*speed;
      r._ty += (target.y - r._ty)*speed;
      const dx=target.x-r._tx, dy=target.y-r._ty;
      const angle=Math.atan2(dy,dx)*180/Math.PI;
      r.style.left=r._tx+'px'; r.style.top=r._ty+'px';
      r.style.transform=`translate(-50%,-50%) rotate(${angle+45}deg)`;
    });
    requestAnimationFrame(loop);
  }
  loop();
})();
</script>
